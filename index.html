<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH LP Tools</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --ink: #14171a; --muted: #5b6470; --line: #e3e6e1;
    --accent: #0a7d4f; --accent-ink: #ffffff; --warn-bg: #fff7e6; --warn-line: #f0c36d; --code: #eef1ec;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1113; --card: #161a1d; --ink: #e8ebee; --muted: #9aa3ad; --line: #262c31;
      --accent: #2fd08a; --accent-ink: #06140d; --warn-bg: #2a2212; --warn-line: #7a5a1c; --code: #1d2226;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1113; --card: #161a1d; --ink: #e8ebee; --muted: #9aa3ad; --line: #262c31;
    --accent: #2fd08a; --accent-ink: #06140d; --warn-bg: #2a2212; --warn-line: #7a5a1c; --code: #1d2226;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 20px; margin: 40px 0 12px; }
  h3 { font-size: 16px; margin: 20px 0 6px; }
  p, li { color: var(--ink); }
  .lede { color: var(--muted); font-size: 17px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
  code { background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .files { display: grid; gap: 12px; }
  .file { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .file .name { font-weight: 600; }
  .file .meta { color: var(--muted); font-size: 13px; }
  .btns { display: flex; gap: 8px; }
  button, .btn { appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  ol, ul { padding-left: 22px; }
  li { margin: 6px 0; }
  details { border-top: 1px solid var(--line); padding: 12px 0; }
  details:last-of-type { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
    padding: 10px 12px; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  #gate { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px; text-align: center; }
  #gate input { font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); width: 280px; text-align: center; }
  #gate .err { color: #d44; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div id="gate">
    <h1>RH LP Tools</h1>
    <p class="muted">Enter the password to continue.</p>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button class="primary" id="go">Unlock</button>
    <div class="err" id="err"></div>
  </div>
</main>

  var ITER=310000;
  var unb64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var dec=new TextDecoder();
  async function unlock(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:unb64(C.salt),iterations:ITER},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(C.iv)},key,unb64(C.ct));
    return dec.decode(pt);
  }
  async function go(){
    var pw=document.getElementById("pw").value;
    if(!pw)return;
    document.getElementById("go").disabled=true;
    document.getElementById("err").textContent="";
    try{
      var html=await unlock(pw);
      var app=document.getElementById("app");
      app.innerHTML=html;
      var codes=[];
      app.querySelectorAll("script").forEach(function(old){codes.push(old.textContent);old.remove()});
      codes.forEach(function(c){var s=document.createElement("script");s.textContent=c;document.body.appendChild(s)});
    }catch(e){
      document.getElementById("err").textContent="Wrong password.";
      document.getElementById("go").disabled=false;
    }
  }
  document.getElementById("go").addEventListener("click",go);
  document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
})();
